# Haalt elke 10 minuten de golfhoogte van IJGeul 1 op en publiceert de site (incl. data/IJGeul1.json) op GitHub Pages.
# Instellen: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: IJGeul 1 golfdata

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub start dit 'zo goed mogelijk'; vaak een paar minuten later
  workflow_dispatch:          # handmatig starten via het tabblad Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Meting ophalen
        run: node scripts/fetch-IJGeul1.mjs   # mislukt dit, dan blijft de vorige versie van de site gewoon staan
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
